# Example configuration file for glock-server
# Copy this file to config.yaml and adjust values as needed

# HTTP server configuration
port: 8080
host: ""  # Leave empty to bind to all interfaces (0.0.0.0)

# Server capacity
capacity: 10000  # Maximum number of locks that can be created (max: 1048576 = 2^20)

# Lock defaults
default_ttl: 30s        # Default lease duration for locks
default_max_ttl: 5m     # Maximum allowed lease duration

# Queue configuration
default_queue_timeout: 5m  # Default timeout for clients waiting in queue
queue_max_size: 1024       # Maximum number of clients that can wait in queue per lock (max: 1048576 = 2^20)
